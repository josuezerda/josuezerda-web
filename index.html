<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Josué Zerda — Sitio en construcción</title>
<meta name="description" content="El sitio de Josué Zerda está en construcción. Volvemos muy pronto.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060f">
<link rel="icon" type="image/png" sizes="48x48" href="img/jz-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/jz-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Mr+Dafoe&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--tx:#e8ecff;--mut:#8b93b8;--c1:#00e5ff;--c2:#7c4dff;--c3:#ff3d9a;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100svh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 80% 0%,rgba(124,77,255,.28),transparent),radial-gradient(50% 40% at 0% 60%,rgba(0,229,255,.14),transparent)}
canvas{position:fixed;inset:0;z-index:-1}
main{flex:1;display:grid;place-items:center;text-align:center;padding:40px 20px}
.logo{width:92px;height:92px;border-radius:22px;margin:0 auto 26px;box-shadow:0 0 50px rgba(240,194,122,.25);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.tag{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--c1);border:1px solid rgba(0,229,255,.35);padding:6px 14px;border-radius:99px;display:inline-block;margin-bottom:22px}
.tag:before{content:"●";margin-right:8px;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.2}}
h1{font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.05;letter-spacing:-.03em}
.g{background:linear-gradient(90deg,var(--c1),var(--c2) 55%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
p.l{color:var(--mut);font-size:1.1rem;max-width:520px;margin:20px auto 0}
.bar{width:min(320px,70vw);height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin:34px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));animation:ld 2.2s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:36px}
.soc a{padding:11px 22px;border-radius:12px;border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:.92rem;transition:.25s}
.soc a:hover{border-color:var(--c1);transform:translateY(-3px)}
footer{padding:22px 16px 28px;text-align:center;color:var(--mut);font-size:.8rem}
footer a{color:var(--mut);margin:0 10px;text-decoration:none}footer a:hover{color:var(--c1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <div>
    <img class="logo" src="img/jz-192.png" alt="JZ — Josué Zerda">
    <span class="tag">EN CONSTRUCCIÓN</span>
    <h1>Estamos preparando<br><span class="g">algo nuevo</span></h1>
    <p class="l">El sitio de Josué Zerda se está renovando. Volvemos muy pronto con tecnología, emprendimiento e ideas para el mercado del futuro.</p>
    <div class="bar"><i></i></div>
    <div class="soc">
      <a href="https://www.instagram.com/josuezerda/" target="_blank" rel="noopener">Instagram ↗</a>
      <a href="https://www.facebook.com/josue.zerda" target="_blank" rel="noopener">Facebook ↗</a>
      <a href="https://x.com/JosueZerda" target="_blank" rel="noopener">X ↗</a>
    </div>
  </div>
</main>
<footer>
  <a href="/privacidad/">Política de privacidad</a><a href="/terminos/">Condiciones del servicio</a><a href="/eliminar-datos/">Eliminación de datos</a><br><br>© 2026 Josué Zerda
</footer>
<script>
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(80,W/16|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
addEventListener('resize',rs);rs();
(function f(){ctx.clearRect(0,0,W,H);
for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.fillStyle='rgba(0,229,255,.7)';ctx.fillRect(p.x,p.y,2,2)}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<130){ctx.strokeStyle=`rgba(124,77,255,${.25*(1-d/130)})`;ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke()}}
requestAnimationFrame(f)})();
</script>
</body>
</html>
